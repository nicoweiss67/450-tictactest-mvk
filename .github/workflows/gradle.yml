name: CI
 
on:
  push:
    branches:
      - '**'
 
permissions:
  contents: read
  packages: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/nicoweiss67/450-tictactest-mvk-devcontainer:sha-fa2903e
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
 
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
 
      - name: Gradle Wrapper ausführbar machen
        run: chmod +x ./gradlew
 
      - name: Gradle-Abhängigkeiten cachen
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
 
      - name: Build
        run: ./gradlew assemble --no-daemon
 
      - name: Test
        run: ./gradlew test jacocoTestReport --no-daemon
 
      - name: Testergebnisse hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'

      - name: JaCoCo HTML-Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-html-report
          path: build/reports/jacoco/test/html
