name: Publish DevContainer

# Freigabe-Prozess: Ein DevContainer-Release entsteht NUR durch einen Git-Tag vX.Y.Z
# auf einem Commit, der in main enthalten ist. Der Workflow baut dann das Image, pusht
# es als :vX.Y.Z (und :latest) in die GitHub Container Registry und öffnet danach einen
# PR, der devcontainer.json und alle CI-Workflows auf diese Version umstellt.
# Ein normaler Push auf main veröffentlicht nichts -> keine unfreigegebenen Images.
# Details: docs/devcontainer.md
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freigabe prüfen (Tag muss auf main liegen)
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::Tag $GITHUB_REF_NAME liegt nicht auf main - keine Freigabe"; exit 1; }

      - name: Image-Name und Tag bestimmen
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/450-tictactest-mvk-devcontainer" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest

  update-references:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken (main)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Image-Tag in devcontainer.json und CI-Workflows ersetzen
        run: |
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          TAG="${{ needs.build-and-push.outputs.tag }}"
          grep -rlE "${IMAGE}:[A-Za-z0-9._-]+" .devcontainer/devcontainer.json .github/workflows \
            | xargs sed -i -E "s|${IMAGE}:[A-Za-z0-9._-]+|${IMAGE}:${TAG}|g"

      - name: Pull Request erstellen
        uses: peter-evans/create-pull-request@v7
        with:
          # GITHUB_TOKEN darf keine Dateien unter .github/workflows ändern -> eigenes PAT
          # (Scopes: Contents, Pull requests, Workflows). Als Repo-Secret PAT_TOKEN hinterlegen.
          token: ${{ secrets.PAT_TOKEN }}
          base: main
          branch: devcontainer/update-${{ needs.build-and-push.outputs.tag }}
          title: "DevContainer auf ${{ needs.build-and-push.outputs.tag }} aktualisieren"
          commit-message: "chore: DevContainer-Image auf ${{ needs.build-and-push.outputs.tag }} aktualisieren"
          body: |
            Neues DevContainer-Image wurde in ghcr.io veröffentlicht:
            `${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}`

            Dieser PR stellt `devcontainer.json` und alle CI-Workflows darauf um.
