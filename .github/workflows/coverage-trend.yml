name: Coverage Trend

# Bei jeder Änderung auf main: Coverage messen, an history.csv anhängen und
# Trend + JaCoCo-Report auf GitHub Pages (Branch gh-pages) veröffentlichen.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

# verhindert, dass zwei Läufe gleichzeitig history.csv überschreiben
concurrency:
  group: coverage-trend
  cancel-in-progress: false

jobs:
  coverage-trend:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Tests + JaCoCo-Report
        run: |
          chmod +x ./gradlew
          ./gradlew test jacocoTestReport --no-daemon

      - name: Line Coverage aus jacocoTestReport.xml lesen
        id: cov
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("build/reports/jacoco/test/jacocoTestReport.xml").getroot()
          # Counter direkt unter <report> = Gesamtwert des Projekts
          c = next(c for c in root.findall("counter") if c.get("type") == "LINE")
          missed, covered = int(c.get("missed")), int(c.get("covered"))
          print(f"percent={100 * covered / (missed + covered):.1f}")
          PY

      - name: Historie von gh-pages holen und neuen Messwert anhängen
        run: |
          mkdir pages
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch origin gh-pages
            git show origin/gh-pages:history.csv > pages/history.csv 2>/dev/null || true
          fi
          [ -s pages/history.csv ] || echo "Datum,Commit,Coverage" > pages/history.csv
          echo "$(date -u +%F),$(git rev-parse --short HEAD),${{ steps.cov.outputs.percent }}" >> pages/history.csv
          cp .github/coverage-pages/index.html pages/index.html
          cp -r build/reports/jacoco/test/html pages/report
          echo "Coverage: ${{ steps.cov.outputs.percent }} %" >> "$GITHUB_STEP_SUMMARY"

      - name: Auf GitHub Pages veröffentlichen (Branch gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: pages
